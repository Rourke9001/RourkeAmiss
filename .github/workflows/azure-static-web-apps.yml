name: Deploy

# Requires the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN, which does not
# exist until the Static Web App is created.
#
# This is NOT dormant before then. The pull_request trigger fires on any PR
# targeting main, and the deploy step fails with "deployment_token was not
# provided" — after the build and both guards have run and passed. Until the
# secret exists, expect that red X on every PR and read the guard steps above
# it for the signal. `verify` in ci.yml is the check that means anything.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # This workflow and ci.yml both trigger on push to main, independently.
      # Without the guards here, a deploy can publish while verification fails —
      # and branch protection, which would otherwise prevent that, is a repo
      # setting the deploy cannot depend on. The two guards whose failures are
      # invisible at runtime therefore run in the deploy path itself: one
      # catches a never-publish leak, the other a CSP that would silently stop
      # the form hydrating and the bars drawing. Oryx rebuilds the site inside
      # the deploy action; this build is of the same commit.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Never-publish guard
        run: npm run check:forbidden

      - name: CSP coverage guard
        run: npm run check:csp

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '/'
          api_location: 'api'
          output_location: 'dist'

  # The Free plan allows exactly three preview environments. Without this job a
  # closed pull request keeps its environment and the fourth one fails.
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
